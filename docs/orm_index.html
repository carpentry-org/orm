                    <h1>
                        orm
                    </h1>
                    <p>A database-agnostic ORM layer for Carp. <code>derive-model</code>
generates CRUD functions for a type by reading its <code>members</code> at macro-expansion
time and delegating SQL dialect / row marshalling to a pluggable backend.</p>
<p>See the <a href="https://github.com/carpentry-org/orm">README</a> for usage.</p>
